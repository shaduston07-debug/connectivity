# XcodeGen spec for the iOS app, its share extension and its Control Center buttons.
#   brew install xcodegen && xcodegen generate && open InkwellDrop.xcodeproj
name: InkwellDrop
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settingGroups:
  common:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  InkwellDrop:
    type: application
    platform: iOS
    sources:
      - path: Core
      - path: Shared
      - path: App
        excludes: ["Info.plist"]
      - path: Controls/Intents
      - path: Assets.xcassets
    dependencies:
      - target: InkwellDropShare
        embed: true
      - target: InkwellDropControls
        embed: true
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: InkwellDrop
        PRODUCT_BUNDLE_IDENTIFIER: com.mangashaduston.inkwelldrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Inkwell Drop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Inkwell Drop uses Bluetooth to find nearby devices and send files to them.
        NSLocalNetworkUsageDescription: When both devices are on the same Wi-Fi network, Inkwell Drop sends over it because it is much faster than Bluetooth.
        WiFiAwareServices:
          _inkwelldrop._tcp:
            Publishable: {}
            Subscribable: {}
        NSPhotoLibraryAddUsageDescription: Inkwell Drop saves the photos and videos you receive to your library.
        # Lets Inkwell Drop keep looking for senders, and finish transfers, while it is in the background.
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        # Received files appear in the Files app under On My iPhone > Inkwell Drop.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  InkwellDropShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Core
      - path: Shared
      - path: ShareExtension
        excludes: ["Info.plist"]
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: InkwellDropShare
        PRODUCT_BUNDLE_IDENTIFIER: com.mangashaduston.inkwelldrop.share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DROP_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Inkwell Drop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Inkwell Drop uses Bluetooth to find nearby devices and send files to them.
        NSLocalNetworkUsageDescription: When both devices are on the same Wi-Fi network, Inkwell Drop sends over it because it is much faster than Bluetooth.
        WiFiAwareServices:
          _inkwelldrop._tcp:
            Publishable: {}
            Subscribable: {}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
  InkwellDropControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Controls
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: InkwellDropControls
        PRODUCT_BUNDLE_IDENTIFIER: com.mangashaduston.inkwelldrop.controls
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Inkwell Drop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
