name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android app and protocol tests
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the Swift test peer
        working-directory: ios
        run: swift build --product drop-cli

      - name: Protocol tests (Kotlin, and Kotlin against Swift)
        working-directory: android
        run: DROP_SWIFT_CLI="$GITHUB_WORKSPACE/ios/.build/debug/drop-cli" ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/InkwellDrop.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: InkwellDrop-apk
          path: InkwellDrop.apk

  ios:
    name: iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          # Wi-Fi Aware needs the iOS 26 SDK (Xcode 26). Without it the app still builds, minus that feature.
          newest=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -t_ -k2 -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project InkwellDrop.xcodeproj \
            -scheme InkwellDrop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/InkwellDrop.app/PlugIns/InkwellDropShare.appex
          test -d build/Build/Products/Release-iphoneos/InkwellDrop.app/PlugIns/InkwellDropControls.appex

      - name: Show compile errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -100 || true

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/InkwellDrop.app Payload/
          # Ad-hoc sign with the entitlements, so tools that re-sign the app for your device can see
          # which ones it asks for. Inner bundles first.
          app=Payload/InkwellDrop.app
          codesign --force --sign - --entitlements Entitlements/InkwellDropShare.entitlements "$app/PlugIns/InkwellDropShare.appex"
          codesign --force --sign - "$app/PlugIns/InkwellDropControls.appex"
          codesign --force --sign - --entitlements Entitlements/InkwellDrop.entitlements "$app"
          codesign -d --entitlements - "$app" || true
          zip -qry "$GITHUB_WORKSPACE/InkwellDrop.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/InkwellDrop.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: InkwellDrop-ipa
          path: InkwellDrop.ipa

  release:
    name: Publish "latest" release
    needs: [android, ios]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest InkwellDrop.apk InkwellDrop.ipa \
            --target "$GITHUB_SHA" \
            --title "Inkwell Drop (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. InkwellDrop.apk installs directly on Android. InkwellDrop.ipa is unsigned: install it with SideStore, AltStore, Sideloadly or similar."
